name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage gate (fail under 90%)
        run: pytest -q --cov --cov-report=term-missing

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Pipeline on synthetic data (plumbing only)
        run: python -m src.pipeline --synthetic --quick --out-dir reports --model-path models/model.joblib
      - name: Serve and call the API
        run: |
          uvicorn src.api:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/decision -H 'content-type: application/json' \
            -d '{"pan_hash":"ci","age_years":35,"annual_income":300000,"loan_amount":300000,"annuity":18000,"years_employed":8}' | tee /dev/stderr | grep -q '"decision"'

  docker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt && python -m src.pipeline --synthetic --quick
      - run: docker build -t loan-decisioning-engine .
